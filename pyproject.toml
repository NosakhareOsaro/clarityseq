[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarityseq"
version = "0.1.0"
description = """ClaritySeq: a DRAGEN-GATK pangenome-aware clinical WGS \
platform with Bayesian ACMG classification (ACGS 2024 v1.2), automated \
ClinVar reclassification monitoring, and GA4GH Beacon v2.1.1 federation."""
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Nosakhare Odionfo Osaro", email = "osaronosakhare@gmail.com" },
]
keywords = [
    "whole-genome-sequencing", "clinical genomics", "DRAGEN-GATK",
    "pangenome", "ACMG", "ACGS 2024", "ClinGen", "GA4GH Beacon",
    "pharmacogenomics", "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pydantic>=2.6",
    "click>=8.1",
    "rich>=13",
    "httpx>=0.27",
    "tenacity>=8",
]

[project.optional-dependencies]
# The Bayesian classifier is its own distribution under bayesacmg/.
bayes = ["bayesacmg"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.9",
    "ruff>=0.4",
    "black>=24.3",
]

[project.urls]
Homepage = "https://github.com/NosakhareOsaro/clarityseq"
Repository = "https://github.com/NosakhareOsaro/clarityseq"
"Archived release" = "https://doi.org/10.5281/zenodo.21530556"

[tool.hatch.build.targets.wheel]
packages = [
    "annotation",
    "beacon_api",
    "multi_ancestry",
    "pgx",
    "phenopackets_input",
    "prioritisation",
    "reclassification",
    "reporting",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.mypy]
python_version = "3.12"
